name: Install and Build

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação de dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      # A suíte unitária não depende do app servido. Definir CUTSYNC_E2E_BASE_URL
      # faz o playwright.config.ts omitir o bloco webServer, evitando um build
      # completo só para rodar os specs de tests/unit.
      - name: Testes unitários
        run: npm run test:unit
        env:
          CUTSYNC_E2E_BASE_URL: http://127.0.0.1:8081

      - name: Exportar web
        run: npm run build:web